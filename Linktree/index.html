body {

nav li:hover {

nav a {

    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    text-decoration: none;
    color: white;
    font-family: sans-serif;
    font-weight: 600;
}

nav img {
    width: 40px;
    height: 40px;
    object-fit: contain;
    border-radius: 8px;

nav span {
